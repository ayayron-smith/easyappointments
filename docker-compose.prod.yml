# Production stack for The Pink Magnolia booking site.
# Usage
#   cp .env.example .env    (then edit the passwords)
#   docker compose -f docker-compose.prod.yml up -d --build

services:
    easyappointments:
        build: .
        image: pink-magnolia/easyappointments:latest
        restart: unless-stopped
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            BASE_URL: ${BASE_URL:-https://book.ayayronsmith.com}
            LANGUAGE: english
            DEBUG_MODE: 'false'
            DB_HOST: mysql
            DB_NAME: easyappointments
            DB_USERNAME: easyappointments
            DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
        volumes:
            - storage:/var/www/html/storage
        ports:
            - '${APP_PORT:-8080}:80'

    mysql:
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
            MYSQL_DATABASE: easyappointments
            MYSQL_USER: easyappointments
            MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
        volumes:
            - mysql:/var/lib/mysql
        healthcheck:
            # TCP ping only answers once first-run setup is finished and the real server is up
            test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s

volumes:
    storage:
    mysql:
